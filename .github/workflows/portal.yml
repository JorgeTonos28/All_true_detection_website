name: Portal validation
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: portal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            database: sqlite
            db_name: ':memory:'
          - php: '8.4'
            database: mysql
            db_name: atd_test
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: atd_ci_only
          MYSQL_DATABASE: atd_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      APP_ENV: testing
      DB_CONNECTION: ${{ matrix.database }}
      DB_DATABASE: ${{ matrix.db_name }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: atd_ci_only
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, sqlite3, pdo_sqlite, pdo_mysql, curl, fileinfo, gd, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: composer validate --strict
      - run: php vendor/bin/pint --test
      - run: php vendor/phpunit/phpunit/phpunit
      - run: composer audit --no-interaction
